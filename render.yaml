services:
  - type: web
    name: tyyli-api
    runtime: docker
    plan: free
    healthCheckPath: /openapi.json
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: JAC_SERVE_AUTH_SECRET
        generateValue: true
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      # App Attest was validated end to end with the TestFlight build.
      # Keep strict enforcement enabled for paid AI features.
      - key: TYYLI_REQUIRE_APP_ATTEST
        value: "true"
      - key: TYYLI_APPLE_TEAM_ID
        value: 48P4DA4TU3
      - key: TYYLI_IOS_BUNDLE_ID
        value: com.yoonseoshin.tyyli
      - key: TYYLI_CLAUDE_GLOBAL_DAILY_LIMIT
        value: "500"
      - key: TYYLI_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: TYYLI_RATE_LIMIT_ANALYZE
        value: "30"
      - key: TYYLI_RATE_LIMIT_RECOMMEND
        value: "30"
      - key: TYYLI_RATE_LIMIT_EXPLAIN
        value: "30"
      - key: TYYLI_RATE_LIMIT_PRODUCT_LOOKUP
        value: "30"
      - key: TYYLI_RATE_LIMIT_CHAT
        value: "100"
      - key: TYYLI_RATE_LIMIT_STYLE_IDENTITY
        value: "30"
      - key: PYTHONUNBUFFERED
        value: "1"
