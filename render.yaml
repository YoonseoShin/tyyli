services:
  - type: web
    name: tyyli-api
    runtime: docker
    plan: free
    healthCheckPath: /openapi.json
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: JAC_SERVE_AUTH_SECRET
        generateValue: true
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: TYYLI_RATE_LIMIT_WINDOW_SECONDS
        value: "3600"
      - key: TYYLI_RATE_LIMIT_ANALYZE
        value: "10"
      - key: TYYLI_RATE_LIMIT_RECOMMEND
        value: "10"
      - key: TYYLI_RATE_LIMIT_EXPLAIN
        value: "10"
      - key: TYYLI_RATE_LIMIT_PRODUCT_LOOKUP
        value: "10"
      - key: TYYLI_RATE_LIMIT_PRODUCT_SEARCH
        value: "20"
      - key: TYYLI_RATE_LIMIT_IMAGE_FETCH
        value: "60"
      - key: TYYLI_RATE_LIMIT_CHAT
        value: "30"
      - key: TYYLI_RATE_LIMIT_STYLE_IDENTITY
        value: "10"
      - key: PYTHONUNBUFFERED
        value: "1"
