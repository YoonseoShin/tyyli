[project]
name = "mobile-starter"
version = "0.0.1"
description = "Mobile app starter - one Jac source, iOS + Android + web"
entry-point = "main"
kind = "mobile"
# JacHammer and jac start --scale run the pinned toolchain (the mobile target needs 0.37.x).
jac-version = "0.37.25"

[client]

[client.api]
base_url = "https://tyyli-api.onrender.com"

# App-side helpers (placeholder weather/calendar/outfits/chat, closet actions)
# run on the device. Pinning keeps their plain functions in the client bundle.
[placement.pins]
"services.*" = "client"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-native-web = "^0.19.13"
"@react-native-async-storage/async-storage" = "*"
"@expo/vector-icons" = "^15.0.2"
# The browser bundle uses the Expo 51-compatible web adapter. Native uses
# the SDK 57 package declared separately below.
"expo-image-picker" = "~15.0.7"

[dependencies.npm.native]
"@expo/app-integrity" = "58.0.2"
"expo" = "~58.0.22"
"expo-asset" = "~58.0.19"
"expo-constants" = "~58.0.14"
"expo-file-system" = "~58.0.13"
"expo-font" = "~58.0.11"
"expo-image-manipulator" = "~58.0.16"
"expo-image-picker" = "~58.0.10"
"expo-location" = "~58.0.20"
"expo-secure-store" = "~58.0.2"
"expo-sqlite" = "~58.0.15"
"expo-status-bar" = "~58.0.4"
"react" = "19.3.0"
"react-native" = "0.88.1"
"react-native-gesture-handler" = "~3.3.0"
"react-native-safe-area-context" = "~5.10.1"
"react-native-screens" = "~4.30.1"
"@react-native-async-storage/async-storage" = "2.2.0"
"@expo/vector-icons" = "^15.0.2"
# Typefaces (DESIGN_SYSTEM.md 3.1), loaded by ui/fonts.native.jac.
"@expo-google-fonts/dm-sans" = "^0.4.2"
"@expo-google-fonts/instrument-serif" = "^0.4.1"

[jacpack]
name = 'tyyli-onboarding-flow'
description = 'Jac IDE snapshot for tyyli-onboarding-flow'

[jachammer]
project_id = "prj_c5d6ee25fe9d4054869766c77f587db3"
